<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rozgar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a9d74"/>
      <stop offset="1" stop-color="#17694d"/>
    </linearGradient>
    <mask id="jaw">
      <rect x="-40" y="-40" width="80" height="80" fill="#fff"/>
      <rect x="-3.5" y="-28" width="7" height="9" rx="1" fill="#000"/>
    </mask>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>

  <!-- wrench: handle bottom-left to head top-right -->
  <g transform="translate(32 33) rotate(45) scale(1.1)" fill="#fff">
    <rect x="-3" y="-14" width="6" height="34" rx="3"/>
    <circle cx="0" cy="-18" r="8" mask="url(#jaw)"/>
  </g>
</svg>
