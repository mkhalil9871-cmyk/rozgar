<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Rozgar">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fbf86"/>
      <stop offset="1" stop-color="#0b6b4a"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#g)"/>
  <!-- house outline -->
  <path d="M14 30 L32 15 L50 30 V48 a3 3 0 0 1 -3 3 H17 a3 3 0 0 1 -3 -3 Z" fill="none" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
  <!-- open-ended wrench inside the house -->
  <mask id="jaw">
    <rect width="64" height="64" fill="#fff"/>
    <rect x="29" y="20" width="6" height="10" rx="1" fill="#000"/>
  </mask>
  <g transform="rotate(-40 32 38)" fill="#ffc94a">
    <rect x="29.5" y="32" width="5" height="17" rx="2.5"/>
    <circle cx="32" cy="29" r="7.5" mask="url(#jaw)"/>
  </g>
</svg>
