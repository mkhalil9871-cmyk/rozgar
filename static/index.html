<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rozgar</title>
  <meta name="description" content="Fair home-repair prices with Gemma 4">
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/style.css?v=22">
</head>
<body>
  <header>
    <div class="brand"><svg class="logo-svg" viewBox="0 0 64 64" role="img" aria-label="Rozgar"><defs><linearGradient id="lg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient><mask id="jaw1"><rect x="-40" y="-40" width="80" height="80" fill="#fff"/><rect x="-3.5" y="-28" width="7" height="9" rx="1" fill="#000"/></mask></defs><rect width="64" height="64" rx="16" fill="url(#lg1)"/><g transform="translate(32 32) rotate(45)" fill="#fff"><rect x="-3" y="-14" width="6" height="34" rx="3"/><circle cx="0" cy="-18" r="8" mask="url(#jaw1)"/></g><g transform="translate(32 32) rotate(-45)"><rect x="-2.75" y="-12" width="5.5" height="32" rx="2.75" fill="#d7f2e6"/><rect x="-11" y="-22" width="22" height="10" rx="3" fill="#d7f2e6"/><rect x="-11" y="-22" width="6" height="10" rx="2" fill="#b4e3cf"/></g></svg><div><b>Rozgar</b><span class="tag" data-t="tagline"></span></div></div>
    <div class="controls">
      <div class="seg" id="langSeg">
        <button data-lang="en">English</button>
        <button data-lang="ur">اردو</button>
        <button data-lang="roman">Roman</button>
      </div>
      <div class="userbox hidden" id="userBox">
        <span id="userIc"></span>
        <span id="userName"></span>
        <button class="secondary" id="logoutBtn" data-t="logout"></button>
      </div>
    </div>
  </header>

  <main>
    <section id="login" class="hidden">
      <div class="login-hero">
        <svg class="logo-svg lg" viewBox="0 0 64 64" role="img" aria-label="Rozgar"><defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" class="bg1"/><stop offset="1" class="bg2"/></linearGradient><mask id="jaw2"><rect x="-40" y="-40" width="80" height="80" fill="#fff"/><rect x="-3.5" y="-28" width="7" height="9" rx="1" fill="#000"/></mask></defs><rect width="64" height="64" rx="16" fill="url(#lg2)"/><g transform="translate(32 32) rotate(45)" fill="#fff"><rect x="-3" y="-14" width="6" height="34" rx="3"/><circle cx="0" cy="-18" r="8" mask="url(#jaw2)"/></g><g transform="translate(32 32) rotate(-45)"><rect x="-2.75" y="-12" width="5.5" height="32" rx="2.75" fill="#d7f2e6"/><rect x="-11" y="-22" width="22" height="10" rx="3" fill="#d7f2e6"/><rect x="-11" y="-22" width="6" height="10" rx="2" fill="#b4e3cf"/></g></svg>
        <h1 data-t="login_title"></h1>
        <p class="muted" data-t="login_sub"></p>
      </div>

      <div id="rolePick" class="role-cards">
        <button class="role-card" data-pick="customer">
          <img class="role-photo" src="/static/photos/customer.jpg?v=22" alt="">
          <b data-t="as_customer"></b>
          <span class="muted small" data-t="as_customer_sub"></span>
        </button>
        <button class="role-card" data-pick="worker">
          <img class="role-photo" src="/static/photos/worker.jpg?v=22" alt="">
          <b data-t="as_worker"></b>
          <span class="muted small" data-t="as_worker_sub"></span>
        </button>
      </div>

      <div id="customerForm" class="card login-form hidden">
        <h2 data-t="as_customer"></h2>
        <div class="qlabel" data-t="your_name"></div>
        <input id="cName" autocomplete="name">
        <div class="qlabel" data-t="phone"></div>
        <div class="row nowrap"><input id="cPhone" type="tel" inputmode="tel" data-tp="phone_ph" autocomplete="tel"><button class="secondary" data-otp="c" data-t="send_code"></button></div>
        <div id="cOtpBox" class="hidden"><div class="qlabel" data-t="otp"></div><input id="cOtp" inputmode="numeric" maxlength="4"><p class="small muted" data-t="otp_hint"></p></div>
        <div class="qlabel" data-t="area"></div>
        <select id="cArea"></select>
        <button class="primary" id="cLogin" data-t="continue_btn"></button>
        <button class="link" data-back data-t="back"></button>
        <p class="small muted" data-t="demo_login"></p>
      </div>

      <div id="workerForm" class="card login-form hidden">
        <div class="seg tabs"><button class="active" data-wtab="signin" data-t="sign_in"></button><button data-wtab="join" data-t="join"></button></div>
        <div id="wSignin">
          <div class="qlabel" data-t="your_profile"></div>
          <select id="wPick"></select>
          <div class="qlabel" data-t="pin"></div>
          <input id="wPin" type="password" inputmode="numeric" maxlength="4">
          <p class="small muted" data-t="pin_hint"></p>
          <button class="primary" id="wLogin" data-t="sign_in"></button>
        </div>
        <div id="wJoin" class="hidden">
          <div class="qlabel" data-t="your_name"></div>
          <input id="jName">
          <div class="qlabel" data-t="phone"></div>
          <div class="row nowrap"><input id="jPhone" type="tel" inputmode="tel" data-tp="phone_ph"><button class="secondary" data-otp="j" data-t="send_code"></button></div>
          <div id="jOtpBox" class="hidden"><div class="qlabel" data-t="otp"></div><input id="jOtp" inputmode="numeric" maxlength="4"><p class="small muted" data-t="otp_hint"></p></div>
          <div class="qlabel" data-t="cnic"></div>
          <input id="jCnic" inputmode="numeric" maxlength="15" data-tp="cnic_ph">
          <div class="qlabel" data-t="trade"></div>
          <select id="jTrade"></select>
          <div class="qlabel" data-t="area"></div>
          <select id="jArea"></select>
          <div class="qlabel" data-t="years_exp"></div>
          <input id="jYears" type="number" min="0" max="60" value="3">
          <button class="primary" id="wJoinBtn" data-t="create_profile"></button>
        </div>
        <button class="link" data-back data-t="back"></button>
      </div>
    </section>

    <section id="customer">
      <div class="hero">
        <div>
          <h1 data-t="hero_title"></h1>
          <p class="muted" data-t="hero_sub"></p>
        </div>
        <img class="hero-photo" src="/static/photos/hero.jpg?v=22" alt="">
      </div>

      <h2><span class="num">1</span><span data-t="step_section"></span></h2>
      <div id="sections" class="sections"></div>

      <div id="subBlock" class="hidden">
        <h2><span class="num">2</span><span data-t="step_sub"></span></h2>
        <div id="subs" class="chips"></div>
      </div>

      <h2><span class="num" id="detailsNum">3</span><span data-t="step_details"></span></h2>
      <p class="muted small" id="notSure" data-t="not_sure"></p>
      <div class="card">
        <div id="questions"></div>
        <div id="symptomsBlock" class="hidden">
          <div class="qlabel" data-t="symptoms"></div>
          <div id="symptoms" class="chips"></div>
        </div>
        <p id="photoHint" class="hint hidden"></p>
        <label class="upload">
          <input type="file" id="photo" accept="image/*">
          <span class="mi ic-cam" style="--i:url(/static/img/camera.svg)"></span><span id="photoLabel"></span>
        </label>
        <img id="preview" class="preview hidden" alt="">
        <div class="qlabel" data-t="explain"></div>
        <textarea id="desc" rows="3" data-tp="explain_ph"></textarea>
        <div class="qlabel" data-t="area"></div>
        <select id="area"></select>
        <button id="diagnoseBtn" class="primary" data-t="diagnose"></button>
        <div id="progress" class="progress hidden"></div>
        <div id="clarify" class="card warn hidden"></div>
      </div>

      <div id="result" class="hidden"></div>

      <h2 data-t="my_jobs"></h2>
      <div id="myJobs"></div>
    </section>

    <section id="worker" class="hidden">
      <h1 data-t="w_title"></h1>
      <div class="card">
        <div id="workerProfile"></div>
      </div>
      <h2 data-t="w_jobs"></h2>
      <div id="openJobs"></div>
    </section>
  </main>

  <footer>
    <span data-t="footer"></span> <b id="modelName">Gemma 4</b> <span data-t="via"></span> ·
    <a href="https://unsplash.com" target="_blank" rel="noopener">Unsplash</a> · <a href="https://www.pexels.com" target="_blank" rel="noopener">Pexels</a> · <a href="https://lucide.dev" target="_blank" rel="noopener">Lucide</a> ·
    <a href="/api/skill" target="_blank" data-t="skill"></a>
  </footer>

  <script src="/static/i18n.js?v=22"></script>
  <script src="/static/app.js?v=22"></script>
</body>
</html>
